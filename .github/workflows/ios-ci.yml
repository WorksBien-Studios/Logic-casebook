name: iOS package CI

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"

jobs:
  package-tests:
    # Runs both test targets: LogicCasebookEngineTests (content/solver
    # validation) and LogicCasebookUITests (StoreKit 2 purchase/restore
    # against a local StoreKitTest session).
    #
    # `swift test` builds every target in the package, not just the test
    # targets' own dependencies -- including LogicCasebookUI, for the host
    # (macOS). Since Package.swift declares no macOS platform, that build
    # falls back to an ancient implicit deployment target where ordinary
    # SwiftUI (Shape, buttonStyle, ...) doesn't exist yet, so plain
    # `swift test` fails on this package regardless of what the test targets
    # themselves need. Running through xcodebuild against an iOS Simulator
    # destination builds everything against the iOS SDK instead, where all
    # of this code is actually meant to run.
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Select newest available Xcode (Swift Testing needs Xcode 16+)
        run: |
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then
            echo "Selecting $latest"
            sudo xcode-select -s "$latest/Contents/Developer"
          fi
          xcodebuild -version

      - name: Pick an available iOS Simulator
        id: sim
        # `-destination "platform=iOS Simulator,name=<X>"` implicitly means
        # OS:latest, which failed here: this runner has "iPhone 15 Pro"
        # instances but only up to iOS 17.5, while the newest installed
        # runtime is 18.2 -- name+"latest" doesn't fall back to an older
        # runtime, it just fails to resolve. Pick a UDID straight out of a
        # runtime's own device list instead, so the pairing is guaranteed to
        # exist.
        run: |
          udid=$(python3 -c "
          import json, subprocess
          data = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))
          def major(key):
              return int(key.split('SimRuntime.iOS-')[1].split('-')[0])
          # The package targets iOS 18, so an older simulator runtime cannot run it.
          ios_runtimes = sorted((k for k in data['devices'] if 'SimRuntime.iOS-' in k and major(k) >= 18), key=lambda k: [int(x) for x in k.split('SimRuntime.iOS-')[1].split('-')])
          for runtime in ios_runtimes:
              for d in data['devices'][runtime]:
                  if d['name'].startswith('iPhone'):
                      print(d['udid'])
                      raise SystemExit
          ")
          if [ -z "$udid" ]; then
            echo "No iPhone simulator found" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "Using simulator udid: $udid"

      - name: Erase the simulator to a clean first-boot state
        # A documented symptom of stale/pre-existing simulator state, so
        # worth keeping regardless -- but on its own this did NOT fix the
        # StoreKit daemon failure below (confirmed on a prior run: identical
        # error survived the erase), so it isn't the whole story.
        run: |
          xcrun simctl shutdown "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl erase "${{ steps.sim.outputs.udid }}"

      - name: xcodebuild test -scheme LogicCasebook-Package
        # Neither test target is a declared package product, so SPM's
        # auto-generated per-product schemes don't include one by their name
        # -- only the umbrella "<PackageName>-Package" scheme runs them.
        #
        # Purchase/restore/revocation rules run against a fake
        # EntitlementBackend (EntitlementLogicTests). Live StoreKitTest's
        # Transaction.currentEntitlements hangs on GitHub-hosted runners
        # ("AMSErrorDomain Code=301" from its local daemon), so only the
        # product-load test uses real StoreKit here.
        run: >
          xcodebuild test -scheme LogicCasebook-Package
          -destination "id=${{ steps.sim.outputs.udid }}"

  ui-build:
    # LogicCasebookUI uses SwiftUI, SwiftData and StoreKit 2 iOS-only APIs
    # (e.g. .navigationBarTitleDisplayMode, .tabViewStyle(.page)), so it must
    # be compiled against the iOS SDK, not the host macOS SDK that a plain
    # `swift build` would use.
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Select newest available Xcode (the package targets iOS 18)
        run: |
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then
            echo "Selecting $latest"
            sudo xcode-select -s "$latest/Contents/Developer"
          fi
          xcodebuild -version

      - name: xcodebuild -scheme LogicCasebookUI (generic iOS destination)
        run: xcodebuild build -scheme LogicCasebookUI -destination "generic/platform=iOS"

  app-build:
    # Builds the distributable app project (ios/App/LogicCasebook.xcodeproj,
    # the scheme the TestFlight workflow archives) for a generic iOS device,
    # unsigned. Catches project-file, asset-catalog, Info.plist and
    # privacy-manifest problems before a paid archive run does.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select newest available Xcode (the app targets iOS 18)
        run: |
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then
            echo "Selecting $latest"
            sudo xcode-select -s "$latest/Contents/Developer"
          fi
          xcodebuild -version

      - name: xcodebuild -scheme LogicCasebook (generic iOS, unsigned)
        run: >
          xcodebuild build
          -project ios/App/LogicCasebook.xcodeproj
          -scheme LogicCasebook
          -configuration Release
          -destination "generic/platform=iOS"
          CODE_SIGNING_ALLOWED=NO

      - name: Assert the built app carries the privacy manifest and icon
        run: |
          app=$(find ~/Library/Developer/Xcode/DerivedData -path '*Release-iphoneos/LogicCasebook.app' -maxdepth 6 -type d | head -1)
          test -f "$app/PrivacyInfo.xcprivacy"
          test -f "$app/Assets.car"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$app/Info.plist"
