name: iOS package CI

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"

jobs:
  engine-tests:
    # `swift test` builds every target in the package, not just
    # LogicCasebookEngineTests' own dependencies -- including LogicCasebookUI,
    # for the host (macOS). Since Package.swift declares no macOS platform,
    # that build falls back to an ancient implicit deployment target where
    # ordinary SwiftUI (Shape, buttonStyle, ...) doesn't exist yet, so plain
    # `swift test` fails on this package regardless of what the test target
    # itself needs. Running through xcodebuild against an iOS Simulator
    # destination builds everything against the iOS SDK instead, where all
    # of this code is actually meant to run.
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Select newest available Xcode (Swift Testing needs Xcode 16+)
        run: |
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then
            echo "Selecting $latest"
            sudo xcode-select -s "$latest/Contents/Developer"
          fi
          xcodebuild -version

      - name: Pick an available iOS Simulator
        id: sim
        run: |
          device=$(xcrun simctl list devices available 2>/dev/null \
            | grep -oE 'iPhone [0-9]+[A-Za-z ]*' | head -1 | sed 's/[[:space:]]*$//')
          if [ -z "$device" ]; then
            echo "No iPhone simulator found" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "device=$device" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $device"

      - name: xcodebuild test -scheme LogicCasebookEngineTests
        run: >
          xcodebuild test -scheme LogicCasebookEngineTests
          -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}"

  ui-build:
    # LogicCasebookUI uses SwiftUI, SwiftData and StoreKit 2 iOS-only APIs
    # (e.g. .navigationBarTitleDisplayMode, .tabViewStyle(.page)), so it must
    # be compiled against the iOS SDK, not the host macOS SDK that a plain
    # `swift build` would use.
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: xcodebuild -scheme LogicCasebookUI (generic iOS destination)
        run: xcodebuild build -scheme LogicCasebookUI -destination "generic/platform=iOS"
