name: Logic Casebook TestFlight

on:
  push:
    tags:
      - "testflight-v*"
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  testflight:
    uses: WorksBien-Studios/.github/.github/workflows/ios-testflight.yml@main
    with:
      validated_sha: ${{ github.sha }}
    secrets:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
