name: iOS app CI

on:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - ".github/workflows/ios-app-ci.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-app-ci.yml"

jobs:
  build-and-test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version

      - name: Run the domain engine's Swift Testing suite on macOS
        run: swift test

      - name: Typecheck the package for iOS Simulator
        run: xcodebuild -scheme LogicCasebookApp -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/LogicCasebookDerivedData" CODE_SIGNING_ALLOWED=NO build

      - name: Select iPhone and iPad simulators
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          python3 - "$RUNNER_TEMP/simulators.json" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          devices = json.load(open(sys.argv[1]))["devices"]
          for family, key in (("iPhone", "IPHONE_SIMULATOR"), ("iPad", "IPAD_SIMULATOR")):
              candidates = [device for runtime, entries in sorted(devices.items(), reverse=True)
                            if "iOS-18-" in runtime for device in entries
                            if device["name"].startswith(family) and device.get("isAvailable", True)]
              if not candidates:
                  raise SystemExit(f"No available {family} simulator")
              print(f"{key}={candidates[0]['udid']}")
          PY

      - name: Run app UI tests on iPhone
        run: |
          xcodebuild -quiet -project App/LogicCasebook.xcodeproj -scheme LogicCasebook \
            -destination "platform=iOS Simulator,id=$IPHONE_SIMULATOR" \
            -derivedDataPath "$RUNNER_TEMP/LogicCasebookAppDerivedData" \
            -parallel-testing-enabled NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO test

      - name: Run app UI tests on iPad
        run: |
          set +e
          xcodebuild -quiet -project App/LogicCasebook.xcodeproj -scheme LogicCasebook \
            -destination "platform=iOS Simulator,id=$IPAD_SIMULATOR" \
            -derivedDataPath "$RUNNER_TEMP/LogicCasebookAppDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/LogicCasebook-iPad.xcresult" \
            -parallel-testing-enabled NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO test
          status=$?
          if [ "$status" -ne 0 ]; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/LogicCasebook-iPad.xcresult" || true
            xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/LogicCasebook-iPad.xcresult" || true
          fi
          exit "$status"
