<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logic Casebook Screenshot Shell</title>
<style>
/* Tokens mirror ios/Sources/LogicCasebookUI/Theme.swift (paper, ink, 朱 accent). */
:root{
  --paper:#F7F4EE; --paper2:#FBF9F4; --border:#E4DBC9;
  --ink:#221D17; --ink-soft:#6E6357; --accent:#A8402E; --accent-soft:#F3DED7;
  --serif:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","IPAMincho",serif;
  --sans:"Hiragino Sans","Yu Gothic","Noto Sans JP","IPAGothic",sans-serif;
}
*{box-sizing:border-box;margin:0}
body{background:#2a2622;font-family:var(--sans);color:var(--ink)}
/* Gallery view: scaled-down previews. Single view (?shot=n): exact pixel size. */
.gallery{display:flex;flex-wrap:wrap;gap:24px;padding:24px;align-items:flex-start}
.preview{width:calc(var(--w)*var(--s));height:calc(var(--h)*var(--s));overflow:hidden;border-radius:6px}
.preview .shot{transform:scale(var(--s));transform-origin:0 0}

.shot{--u:calc(var(--w)/1320);position:relative;width:calc(var(--w)*1px);height:calc(var(--h)*1px);
  background:var(--paper);overflow:hidden;display:flex;flex-direction:column;align-items:center}
.shot::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent 0 calc(var(--u)*46px),rgba(168,64,46,.045) calc(var(--u)*46px) calc(var(--u)*47px))}

.copy{position:relative;z-index:1;width:100%;padding:calc(var(--u)*170px) calc(var(--u)*100px) 0;text-align:center}
.headline{font:700 calc(var(--u)*92px)/1.35 var(--serif);letter-spacing:.02em;line-break:strict;word-break:keep-all}
.headline em{font-style:normal;color:var(--accent)}
.ipad .copy{padding-top:calc(var(--u)*120px)}
.ipad .headline{font-size:calc(var(--u)*78px)}
.stage{position:relative;z-index:1;flex:1;width:100%;display:flex;justify-content:center;align-items:center}
/* Whole devices, never cropped. Sizes are in canvas units (--u = canvas width / 1320). The screen
   keeps Apple's exact screenshot aspect, so a raw simulator capture fills it with no scaling or crop.
   iPhone: titanium frame, black bezel, Dynamic Island, side buttons.
   iPad: aluminium frame, thin even bezel, front camera. */
.iphone{--dw:calc(var(--u)*1080px);--ring:calc(var(--u)*9px);--bz:calc(var(--u)*13px);--sr:calc(var(--u)*130px);--ar:1320/2868}
.ipad{--dw:calc(var(--u)*964px);--ring:calc(var(--u)*6px);--bz:calc(var(--u)*26px);--sr:calc(var(--u)*34px);--ar:2064/2752}
.device{position:relative;width:var(--dw);padding:var(--ring);border-radius:calc(var(--sr) + var(--bz) + var(--ring));
  background:linear-gradient(145deg,#6a665f 0%,#2b2925 38%,#57534c 62%,#26241f 100%);
  box-shadow:0 calc(var(--u)*30px) calc(var(--u)*90px) rgba(34,29,23,.32),inset 0 0 0 calc(var(--u)*1.5px) rgba(255,255,255,.18)}
.bezel{position:relative;background:#000;padding:var(--bz);border-radius:calc(var(--sr) + var(--bz))}
.screen{position:relative;width:100%;aspect-ratio:var(--ar);overflow:hidden;background:var(--paper2);border-radius:var(--sr)}
.island{position:absolute;z-index:3;top:calc(var(--u)*26px);left:50%;width:calc(var(--u)*300px);height:calc(var(--u)*88px);
  margin-left:calc(var(--u)*-150px);background:#000;border-radius:calc(var(--u)*44px)}
.ipad .island{display:none}
.ipad .bezel::after{content:"";position:absolute;top:calc(var(--u)*9px);left:50%;width:calc(var(--u)*9px);height:calc(var(--u)*9px);
  margin-left:calc(var(--u)*-4.5px);border-radius:50%;background:#1b1d26;box-shadow:inset 0 0 0 calc(var(--u)*2px) #2c3040}
.btn{position:absolute;background:linear-gradient(90deg,#57534c,#2b2925);border-radius:calc(var(--u)*4px)}
.iphone .btn{width:calc(var(--u)*9px)}
.iphone .l{left:calc(var(--u)*-7px)} .iphone .r{right:calc(var(--u)*-7px)}
.iphone .b1{top:calc(var(--u)*520px);height:calc(var(--u)*70px)}
.iphone .b2{top:calc(var(--u)*680px);height:calc(var(--u)*140px)}
.iphone .b3{top:calc(var(--u)*850px);height:calc(var(--u)*140px)}
.iphone .b4{top:calc(var(--u)*760px);height:calc(var(--u)*210px)}
.ipad .btn{width:calc(var(--u)*7px);right:calc(var(--u)*-5px)}
.ipad .b1,.ipad .b3{display:none}
.ipad .b2{top:calc(var(--u)*150px);height:calc(var(--u)*62px)}
.ipad .b4{top:calc(var(--u)*230px);height:calc(var(--u)*62px)}
.screen img{display:block;width:100%;height:100%;object-fit:cover}
.slot{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*24px);
  border:calc(var(--u)*6px) dashed var(--border);margin:calc(var(--u)*30px);border-radius:calc(var(--u)*40px);
  font:500 calc(var(--u)*44px)/1.5 var(--sans);color:var(--ink-soft);text-align:center;padding:calc(var(--u)*40px)}
.slot b{font:700 calc(var(--u)*60px) var(--serif);color:var(--ink)}
.slot code{font:calc(var(--u)*36px) ui-monospace,Menlo,monospace;background:var(--accent-soft);color:var(--accent);padding:calc(var(--u)*8px) calc(var(--u)*20px);border-radius:calc(var(--u)*10px)}
.screen.empty .slot{display:flex}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* One entry per App Store screenshot, in store order. One headline per shot. */
const SHOTS = [
  { id:"01-library", capture:"01-library.png", headline:"全1,000事件の<br>本格ロジックパズル",
    note:"Library with four difficulty tabs, hanko stamps (済/完), a locked row." },
  { id:"02-board", capture:"02-board.png", headline:"推測なし。<br>論理だけで<em>必ず</em>解ける",
    note:"Workspace on a Standard case, several ○ × placed, one clue checked." },
  { id:"03-hint", capture:"03-hint.png", headline:"ヒントは答えではなく、<br><em>次の一手</em>",
    note:"Hint half-sheet over the board: clue, logic sentence, justified mark." }
];
const DEVICES = {
  iphone:{ w:1320, h:2868, cls:"iphone", label:"iPhone 6.9\" (1320×2868)" },
  ipad:  { w:2064, h:2752, cls:"ipad", label:"iPad 13\" (2064×2752)" }
};
const q = new URLSearchParams(location.search);
const dev = DEVICES[q.get("device")] || DEVICES.iphone;
const devName = q.get("device") === "ipad" ? "ipad" : "iphone";

function shotEl(s){
  const el = document.createElement("div");
  el.className = "shot " + dev.cls;
  el.style.setProperty("--w", dev.w); el.style.setProperty("--h", dev.h);
  el.id = s.id;
  el.innerHTML = `
    <div class="copy"><h1 class="headline">${s.headline}</h1></div>
    <div class="stage"><div class="device">
      <i class="btn l b1"></i><i class="btn l b2"></i><i class="btn l b3"></i><i class="btn r b4"></i>
      <div class="bezel"><div class="screen empty">
        <img alt="" src="captures/${devName}/${s.capture}">
        <i class="island"></i>
        <div class="slot"><b>画面キャプチャ待ち</b><code>captures/${devName}/${s.capture}</code><span>${s.note}</span></div>
      </div></div></div></div>`;
  const img = el.querySelector("img"), scr = el.querySelector(".screen");
  img.onload = () => scr.classList.remove("empty");
  img.onerror = () => { img.remove(); scr.classList.add("empty"); };
  return el;
}
const root = document.getElementById("root");
const only = q.get("shot");
if (only){ // exact-size render target for the export script
  document.body.style.background = "none";
  root.appendChild(shotEl(SHOTS.find(s => s.id === only)));
} else {
  root.className = "gallery";
  const scale = Math.min(0.28, 1100 / (dev.w * 3.4));
  SHOTS.forEach(s => {
    const p = document.createElement("div");
    p.className = "preview"; p.style.setProperty("--s", scale);
    p.style.setProperty("--w", dev.w + "px"); p.style.setProperty("--h", dev.h + "px");
    p.appendChild(shotEl(s)); root.appendChild(p);
  });
}
</script>
</body>
</html>
