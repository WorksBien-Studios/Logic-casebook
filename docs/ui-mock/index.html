<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Logic Casebook UI Mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&display=swap">
<style>
/* Layout: page chrome (controls + annotation panel) around one scaled iOS device.
   Device tokens (--d-*) reuse the app's own Theme.swift paper palette: 朱 accent on warm paper. */
:root{
  --bg:#E9E5DD; --fg:#211D18; --mut:#6E655A; --line:#D3CCBF; --card:#F6F3EC; --acc:#A8402E;
  --tag-n:#2F5D8A; --tag-s:#3F7D5C; --tag-c:#A8402E;
  --d-bg:#F7F4EE; --d-surf:#FFFFFF; --d-alt:#FBF9F4; --d-line:#E4DBC9; --d-ink:#221D17; --d-soft:#6E6357; --d-faint:#A79C8C;
  --d-acc:#A8402E; --d-acc-s:#F3DED7; --d-good:#3F7D5C; --d-good-s:#E1EEE6; --d-amb:#B8862B; --d-amb-s:#F5EAD4;
  --d-bar:rgba(247,244,238,.86); --d-shadow:rgba(34,29,23,.12);
  --c0:#A8402E; --c1:#2F5D8A; --c2:#3F7D5C; --c3:#9A6E14;
  --serif:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171412; --fg:#EDE6DA; --mut:#A0968A; --line:#38322C; --card:#211D1A; --acc:#E08267;
  --tag-n:#7FB0E0; --tag-s:#7CC39E; --tag-c:#E08267;
  --d-bg:#151210; --d-surf:#201C19; --d-alt:#1B1815; --d-line:#3A342E; --d-ink:#EDE6DA; --d-soft:#B0A69A; --d-faint:#7C7368;
  --d-acc:#E08267; --d-acc-s:#3A2621; --d-good:#6FBF93; --d-good-s:#1F2E26; --d-amb:#DDAE55; --d-amb-s:#372C16;
  --d-bar:rgba(21,18,16,.86); --d-shadow:rgba(0,0,0,.4);
  --c0:#E08267; --c1:#7FB0E0; --c2:#7CC39E; --c3:#DDAE55; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171412; --fg:#EDE6DA; --mut:#A0968A; --line:#38322C; --card:#211D1A; --acc:#E08267;
  --tag-n:#7FB0E0; --tag-s:#7CC39E; --tag-c:#E08267;
  --d-bg:#151210; --d-surf:#201C19; --d-alt:#1B1815; --d-line:#3A342E; --d-ink:#EDE6DA; --d-soft:#B0A69A; --d-faint:#7C7368;
  --d-acc:#E08267; --d-acc-s:#3A2621; --d-good:#6FBF93; --d-good-s:#1F2E26; --d-amb:#DDAE55; --d-amb-s:#372C16;
  --d-bar:rgba(21,18,16,.86); --d-shadow:rgba(0,0,0,.4);
  --c0:#E08267; --c1:#7FB0E0; --c2:#7CC39E; --c3:#DDAE55; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);padding-inline:16px;padding-block:20px 40px;line-height:1.55}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--d-acc);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
header.top h1{font-family:var(--serif);font-size:1.5rem;margin:0;line-height:1.2;text-wrap:balance}
header.top p{margin:4px 0 0;color:var(--mut);font-size:.85rem;max-width:60ch}
.ctl{display:flex;flex-wrap:wrap;gap:8px 16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{padding:6px 12px;font-size:.8rem;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.jump button{padding:5px 11px;border:1px solid var(--line);border-radius:999px;font-size:.78rem;background:var(--card)}
.jump button[aria-pressed=true]{border-color:var(--fg);font-weight:700}
.main{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr)}}
.stagebox{min-width:0;display:flex;justify-content:center}
.scaler{position:relative}
.dev{position:absolute;left:0;top:0;transform-origin:0 0;background:#0c0b0a;padding:11px;box-shadow:0 24px 60px rgba(0,0,0,.28),0 0 0 2px #2a2724 inset}
.dev.phone{width:415px;height:874px;border-radius:64px}
.dev.pad{width:1216px;height:856px;border-radius:38px}
.dev.one{width:766px;height:1155px;border-radius:44px}
.scr{position:relative;overflow:hidden;background:var(--d-bg);color:var(--d-ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.phone .scr{width:393px;height:852px;border-radius:53px}
.pad .scr{width:1194px;height:834px;border-radius:27px}
.one .scr{width:744px;height:1133px;border-radius:33px;font-size:18px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000;z-index:60}
.pad .island,.one .island{display:none}
.status{position:absolute;inset:0 0 auto 0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 44px;font-weight:700;font-size:16px;z-index:50;pointer-events:none}
.pad .status,.one .status{height:28px;padding:0 24px;font-size:13px}
.status i{display:flex;gap:6px;align-items:center}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:138px;height:5px;border-radius:3px;background:var(--d-ink);opacity:.85;z-index:60}
.pad .home,.one .home{width:190px}
/* pages */
.padshell{position:absolute;inset:0;display:flex}
.sidebar{width:250px;flex:none;background:var(--d-alt);border-right:1px solid var(--d-line);padding:44px 12px 20px;display:flex;flex-direction:column;gap:2px}
.sidebar h6{margin:16px 10px 4px;font-size:12px;color:var(--d-faint);font-weight:500;letter-spacing:.06em}
.sidebar button{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;text-align:left;font-size:16px}
.sidebar button[aria-current=true]{background:var(--d-acc-s);color:var(--d-acc);font-weight:700}
.sidebar .ttl{font-family:var(--serif);font-size:20px;font-weight:700;padding:6px 10px 10px}
.col{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}
.page{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--d-bg)}
.phone .page{padding-top:54px}
.pad .page,.one .page{padding-top:28px}
/* iPad single column: one pane, readable column, larger cells and type */
.one .scroll>*,.one .clues>*,.one .sf,.one .seg-ios,.one .gridcard,.one .large,.one .brief,.one .cont,.one .cta,.one .group,.one .sect,.one .sumline,.one .bar,.one .hl2,.one .done,.one .tut,.one .stats,.one .steps{max-width:660px;margin-inline:auto;width:100%}
.one .gridcard{width:calc(100% - 24px);max-width:660px;margin-top:10px}
.one .clues{padding-inline:0}.one .clues>*{width:calc(100% - 24px)}
.one .ch,.one .rh{font-size:17px}
.one .clue .tx{font-size:17px}.one .clue .kind{font-size:12px}
.one .cell svg{width:40px;height:40px}
.one .toolbar,.one .bottomcta{padding-bottom:22px}
.one .toolbar{justify-content:center;gap:10px}.one .toolbar .sp{flex:0 0 24px}
.one .sheet{left:50%;right:auto;transform:translateX(-50%);width:min(100%,640px);padding-bottom:30px}
.one .banner,.one .hint{left:50%;right:auto;transform:translateX(-50%);width:min(calc(100% - 24px),640px)}
.one .tabbar{padding-bottom:10px}
.one .nav .t{font-size:19px}
.nav{flex:none;height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px;background:var(--d-bar);backdrop-filter:blur(16px)}
.nav .t{font-weight:700;font-size:17px;text-align:center;white-space:nowrap}
.nav .t small{display:block;font-weight:400;font-size:11px;color:var(--d-faint);line-height:1.1}
.nav .l{justify-self:start;color:var(--d-acc);display:flex;align-items:center;gap:2px;font-size:17px;padding:8px}
.nav .r{justify-self:end;color:var(--d-acc);padding:8px;display:flex;gap:6px}
.scroll{flex:1;overflow:auto;min-height:0;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.large{font-family:var(--serif);font-size:34px;font-weight:700;padding:6px 20px 4px;line-height:1.2}
.tabbar{flex:none;height:83px;padding:8px 8px 0;display:flex;justify-content:space-around;background:var(--d-bar);backdrop-filter:blur(16px);border-top:.5px solid var(--d-line)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--d-faint);width:90px;height:50px;font-weight:500}
.tabbar button[aria-current=true]{color:var(--d-acc)}
.ic{width:24px;height:24px;display:block}
/* list */
.seg-ios{display:grid;grid-template-columns:repeat(4,1fr);background:var(--d-alt);border:1px solid var(--d-line);border-radius:9px;padding:2px;margin:10px 16px 0}
.seg-ios button{padding:6px 0;border-radius:7px;font-size:14px;font-weight:500;color:var(--d-soft)}
.seg-ios button[aria-pressed=true]{background:var(--d-surf);color:var(--d-ink);font-weight:700;box-shadow:0 1px 3px var(--d-shadow)}
.sumline{margin:10px 20px 0;font-size:13px;color:var(--d-soft);display:flex;justify-content:space-between;gap:12px}
.bar{height:4px;border-radius:2px;background:var(--d-line);margin:8px 20px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--d-acc)}
.sect{margin:18px 16px 6px 20px;display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--d-soft);font-weight:500}
.sect a,.sect button{color:var(--d-acc);font-weight:700;font-size:13px}
.group{margin:0 16px;background:var(--d-surf);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;width:100%;text-align:left;border-bottom:.5px solid var(--d-line);min-height:56px}
.row:last-child{border-bottom:0}
.row .no{font-family:var(--serif);font-size:13px;color:var(--d-faint);width:34px;flex:none;font-variant-numeric:tabular-nums}
.row .ti{flex:1;min-width:0}
.row .ti b{display:block;font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ti small{font-size:12px;color:var(--d-soft)}
.row.lock .ti b{color:var(--d-soft)}
.chev{width:8px;height:14px;color:var(--d-faint);flex:none}
.stamp{width:28px;height:28px;border-radius:50%;border:2px solid var(--d-acc);color:var(--d-acc);font-family:var(--serif);font-weight:700;font-size:12px;display:grid;place-items:center;flex:none;transform:rotate(-8deg)}
.stamp.perfect{box-shadow:0 0 0 2px var(--d-surf),0 0 0 3.5px var(--d-acc)}
.stamp.solved{border-color:var(--d-good);color:var(--d-good)}
.dots{display:flex;gap:3px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--d-amb)}.dots i:nth-child(n+3){background:var(--d-line)}
.more{padding:12px 14px;font-size:13px;color:var(--d-soft);text-align:center}
.cont{margin:12px 16px 0;padding:14px 16px;border-radius:14px;background:var(--d-acc-s);display:flex;align-items:center;gap:12px;width:calc(100% - 32px);text-align:left}
.cont small{display:block;font-size:12px;color:var(--d-acc);font-weight:700;letter-spacing:.04em}
.cont b{font-family:var(--serif);font-size:17px}
.pill{padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700}
.p-b{background:var(--d-good-s);color:var(--d-good)}.p-s{background:var(--d-amb-s);color:var(--d-amb)}.p-a{background:var(--d-acc-s);color:var(--d-acc)}.p-e{background:var(--d-ink);color:var(--d-bg)}
/* search */
.sf{margin:6px 16px 0;height:36px;border-radius:10px;background:var(--d-alt);border:1px solid var(--d-line);display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--d-faint)}
.sf input{flex:1;background:none;border:0;font:inherit;color:var(--d-ink);min-width:0;outline:none;font-size:16px}
.empty{text-align:center;padding:48px 32px;color:var(--d-soft)}.empty b{display:block;color:var(--d-ink);font-size:18px;margin:8px 0 4px}
/* briefing */
.brief{padding:8px 20px 24px;display:flex;flex-direction:column;gap:16px}
.brief h2{font-family:var(--serif);font-size:26px;line-height:1.3;margin:2px 0 0}
.brief p{margin:0;font-size:15.5px;line-height:1.75}
.q{padding:12px 14px;border-radius:12px;background:var(--d-surf);border-left:3px solid var(--d-acc)}
.q small{display:block;font-size:11.5px;color:var(--d-acc);font-weight:700;letter-spacing:.06em;margin-bottom:2px}
.meta{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--d-soft);align-items:center}
.cats{display:flex;flex-direction:column;background:var(--d-surf);border-radius:12px;overflow:hidden}
.cat{padding:11px 14px;border-bottom:.5px solid var(--d-line);display:flex;gap:12px;align-items:flex-start}
.cat:last-child{border:0}
.cat h4{margin:0;width:64px;flex:none;font-size:13px;font-weight:700;padding-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:3px 10px;border-radius:8px;font-size:14px;background:var(--d-alt);border:1px solid var(--d-line)}
.ord{font-size:11.5px;color:var(--d-faint);align-self:center}
.cta{margin:0 16px;height:50px;border-radius:14px;background:var(--d-acc);color:#fff;font-weight:700;font-size:17px;display:grid;place-items:center;width:calc(100% - 32px)}
.dark-cta{color:#1a1310}
.dark-prim .cta{color:#1a1310}
.dark-prim .cta.ghost{color:var(--d-acc)}
.cta.ghost{background:transparent;color:var(--d-acc)}
.bottomcta{flex:none;padding:10px 0 34px;background:var(--d-bar);border-top:.5px solid var(--d-line);display:flex;flex-direction:column;gap:2px}
.pad .bottomcta{padding-bottom:20px}
/* workspace */
.gridcard{flex:none;margin:6px 12px 0;background:var(--d-surf);border-radius:14px;padding:10px 10px 12px;box-shadow:0 1px 2px var(--d-shadow)}
.ghead{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.mm{display:grid;gap:3px;flex:none}
.mm button{width:32px;height:26px;border-radius:6px;border:1.5px solid var(--d-line);font-size:10.5px;font-weight:700;color:var(--d-soft);background:var(--d-alt);line-height:1}
.mm button.part{background:var(--d-amb-s);border-color:var(--d-amb)}
.mm button.full{background:var(--d-good-s);border-color:var(--d-good);color:var(--d-good)}
.mm button[aria-current=true]{outline:2px solid var(--d-acc);outline-offset:1px}
.mm span{visibility:hidden}
.mm button{display:flex;gap:4px;align-items:center;justify-content:center}.mm button i{width:9px;height:9px;border-radius:50%;display:block}
.gtitle{flex:1;min-width:0}
.gtitle b{font-size:15px;display:block}
.legend{display:flex;gap:10px;font-size:11.5px;color:var(--d-soft);margin-top:2px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:3px}.legend svg{width:13px;height:13px}
.pair{display:grid;grid-template-columns:var(--rh) auto;justify-content:center}
.pair>.hd{grid-column:2;grid-row:1}.pair>.rw{grid-column:1;grid-row:2}.pair>.cells{grid-column:2;grid-row:2}
.corner{grid-column:1;grid-row:1;align-self:end;font-size:11.5px;font-weight:700;padding:0 6px 4px 0;text-align:right}
.colcap{font-size:11.5px;font-weight:700;padding:0 0 2px;display:flex;gap:8px;justify-content:space-between}
.colcap em{font-style:normal;color:var(--d-faint);font-weight:400}
.heads{display:flex}
.ch{width:var(--cs);height:var(--chh);font-size:13px;font-weight:500;line-height:1.14;padding-top:7px;display:flex;flex-direction:column;justify-content:flex-start;align-items:center}
.ch span{display:block}.ch .lv{transform:rotate(90deg)}
.hb{border-bottom:2.5px solid}
.heads,.rows{--x:0}
.rh{height:var(--cs);display:flex;align-items:center;font-size:14px;font-weight:500;padding-right:8px;border-right:2.5px solid;justify-content:flex-end;white-space:nowrap}
.cells{display:grid;grid-template-columns:repeat(var(--n),var(--cs));border-left:1px solid var(--d-line);border-top:1px solid var(--d-line)}
.cell{width:var(--cs);height:var(--cs);border-right:1px solid var(--d-line);border-bottom:1px solid var(--d-line);position:relative;display:grid;place-items:center;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.cell svg{width:26px;height:26px;pointer-events:none}
.cell.dim{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--d-alt) 5px 7px)}
.cell:active{background:var(--d-acc-s)}
.m1{color:var(--d-acc)}.m2{color:var(--d-faint)}.m3{color:var(--d-amb)}
.pop{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);display:flex;background:var(--d-ink);border-radius:12px;padding:4px;gap:2px;z-index:20;box-shadow:0 8px 22px var(--d-shadow)}
.pop button{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;color:var(--d-bg)}
.pop button svg{width:22px;height:22px}
.pop button:hover{background:rgba(255,255,255,.18)}
.tip{margin-top:10px;background:var(--d-ink);color:var(--d-bg);border-radius:12px;padding:8px 8px 8px 12px;font-size:12.5px;display:flex;gap:8px;align-items:center}
.tip button{color:var(--d-bg);opacity:.75;font-size:12px;padding:4px 8px}
.clues{flex:1;overflow:auto;min-height:0;padding:10px 12px 8px;scrollbar-width:none}
.clues::-webkit-scrollbar{display:none}
.clues h5{margin:6px 8px 8px;font-size:12px;color:var(--d-soft);font-weight:500;display:flex;justify-content:space-between}
.qline{margin:2px 8px 10px;font-size:13px;color:var(--d-soft)}
.clue{display:flex;gap:10px;padding:9px 10px;border-radius:12px;background:var(--d-surf);margin-bottom:6px;width:100%;text-align:left;align-items:flex-start;transition:background .2s}
.clue .cb{width:22px;height:22px;border-radius:7px;border:1.8px solid var(--d-faint);flex:none;margin-top:1px;display:grid;place-items:center;color:transparent}
.clue.on{background:transparent;color:var(--d-faint)}
.clue.on .cb{background:var(--d-good);border-color:var(--d-good);color:#fff}
.clue.on .tx{text-decoration:line-through;text-decoration-color:var(--d-line)}
.clue.on b.e{color:inherit}
.clue.hl{outline:2px solid var(--d-acc);background:var(--d-acc-s)}
.clue .kind{font-size:10.5px;color:var(--d-soft);font-weight:700;letter-spacing:.04em;display:flex;gap:6px;align-items:center}
.clue .kind i{font-style:normal;padding:0 6px;border-radius:5px;background:var(--d-alt);border:1px solid var(--d-line);font-weight:700}
.clue .tx{font-size:15px;line-height:1.6;margin-top:1px}
b.e{font-weight:700}
b.e0{color:var(--c0)}b.e1{color:var(--c1)}b.e2{color:var(--c2)}b.e3{color:var(--c3)}
.strip{display:flex;align-items:center;gap:4px;margin-top:6px;font-size:12px;flex-wrap:wrap}
.strip span.n{padding:1px 8px;border-radius:6px;border:1.5px solid;font-weight:700}
.strip .ln{height:2px;background:var(--d-faint);width:22px;position:relative}
.strip .ln:after{content:"";position:absolute;right:-1px;top:-3px;border-left:6px solid var(--d-faint);border-top:4px solid transparent;border-bottom:4px solid transparent}
.strip .ln.dash{background:repeating-linear-gradient(90deg,var(--d-faint) 0 4px,transparent 4px 7px)}
.strip .sl{width:9px;height:9px;border-radius:50%;background:var(--d-line)}
.strip small{color:var(--d-faint);margin-left:4px}
.toolbar{flex:none;display:flex;align-items:center;gap:2px;padding:6px 10px 30px;background:var(--d-bar);backdrop-filter:blur(16px);border-top:.5px solid var(--d-line)}
.pad .toolbar{padding-bottom:16px}
.toolbar button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;color:var(--d-acc);min-width:58px;height:46px;justify-content:center;font-weight:500}
.toolbar button:disabled{opacity:.35}
.toolbar .sp{flex:1}

["times","time-3"],"textJA":"「蓮」と「11時」は同じ組だと確定します。"},{"relation":"same","left":["people","person-4"],"right":["locations","location-4"],"textJA":"「健太」と「第一室」は同じ組だと確定します。"},{"relation":"same","left":["people","person-4"],"right":["times","time-1"],"textJA":"「健太」と「9時」は同じ組だと確定します。"},{"relation":"same","left":["objects","object-2"],"right":["locations","location-4"],"textJA":"「犬」と「第一室」は同じ組だと確定します。"},{"relation":"same","left":["objects","object-2"],"right":["times","time-1"],"textJA":"「犬」と「9時」は同じ組だと確定します。"},{"relation":"same","left":["objects","object-4"],"right":["locations","location-2"],"textJA":"「猫」と「第五室」は同じ組だと確定します。"},{"relation":"same","left":["objects","object-4"],"right":["times","time-3"],"textJA":"「猫」と「11時」は同じ組だと確定します。"}],"explanationJA":"手がかり3を使うと、候補は2通りから1通りに絞れます。「蓮」と「第五室」は同じ組だと確定します。"}],"proof":13824}}}</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const IDX = D.index, FREE = D.free;
const TIER = {b:['初級','beginner','p-b',120,10],s:['標準','standard','p-s',260,8],a:['上級','advanced','p-a',360,8],e:['超級','expert','p-e',260,4]};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad4 = n => String(n).padStart(4,'0');
const info = n => IDX[n-1];
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- state ---------- */
const S = {device:'phone', tab:'library', tier:'b', stack:[], sheet:null, own:false, q:'', qtier:'all',
  tut:0, tutCell:0, tipSeen:false, hintOpen:false, banner:null, menu:null, pair:[0,1], screen:'library',
  progress:{1:'perfect',2:'perfect',3:'solved',741:'progress'}, work:{}};

/* ---------- icons ---------- */
const P = {
  book:'M4 5.5C4 4.7 4.7 4 5.5 4H11v15H5.5C4.7 19 4 18.3 4 17.5zM20 5.5c0-.8-.7-1.5-1.5-1.5H13v15h5.5c.8 0 1.5-.7 1.5-1.5z',
  search:'M10.5 4a6.5 6.5 0 1 0 4 11.6l4.5 4.5 1.4-1.4-4.5-4.5A6.5 6.5 0 0 0 10.5 4zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9z',
  help:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 2a7 7 0 1 1 0 14 7 7 0 0 1 0-14zm-.1 2.6c-1.6 0-2.7 1-2.8 2.5h1.7c.1-.6.5-1 1.1-1 .7 0 1.1.4 1.1 1 0 1.3-2 1.3-2 3.1v.3h1.7v-.2c0-1.1 2-1.2 2-3.2 0-1.5-1.2-2.5-2.8-2.5zM11.1 15v1.8h1.8V15z',
  lock:'M7 10V8a5 5 0 0 1 10 0v2h1a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1zm2 0h6V8a3 3 0 0 0-6 0z',
  undo:'M9 7V3L3 9l6 6v-4c4 0 7 1.5 9 5 0-5-3-9-9-9z',
  redo:'M15 7V3l6 6-6 6v-4c-4 0-7 1.5-9 5 0-5 3-9 9-9z',
  bulb:'M12 2a7 7 0 0 0-4 12.7V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.3A7 7 0 0 0 12 2zM9 20h6v1.5a.5.5 0 0 1-.5.5h-5a.5.5 0 0 1-.5-.5z',
  info:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm-1 4h2v2h-2zm0 4h2v6h-2z',
  check:'M9.5 17.5 4 12l1.4-1.4 4.1 4.1 9.1-9.1L20 7.0z',
  side:'M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm5 2H5v10h4z'
};
const ic = (n,extra='') => `<svg class="ic" viewBox="0 0 24 24" fill="currentColor" ${extra}><path d="${P[n]}"/></svg>`;
const chev = '<svg class="chev" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg>';
const back = '<svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>';
function mark(m){
  if(m===1) return '<svg class="m1" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2.6"/></svg>';
  if(m===2) return '<svg class="m2" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
  if(m===3) return '<svg class="m3" viewBox="0 0 24 24"><path d="M12 4.5 20 19H4z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg>';
  return '';
}
const MLAB = ['未入力','確定 ○','除外 ×','候補 △'];

/* ---------- case work state ---------- */
function W(n){
  if(S.work[n]) return S.work[n];
  const c = FREE[n]; const cats = c.categories;
  const pos = cats.map(cat => cat.values.map(v => c.solution.rows.findIndex(r => r[cat.id]===v.id)));
  const w = {marks:{}, undo:[], redo:[], checked:new Set(), hints:0, checks:0, start:Date.now(), pos};
  S.work[n] = w;
  if(n===741){ applyStep(n,0,true); applyStep(n,1,true); w.undo=[]; w.hints=0; }
  return w;
}
const mk = (a,i,b,j) => `${a}.${i}.${b}.${j}`;
const truth = (n,a,i,b,j) => W(n).pos[a][i]===W(n).pos[b][j];
function snap(w){ w.undo.push(JSON.stringify(w.marks)); w.redo=[]; if(w.undo.length>80) w.undo.shift(); }
function setMark(n,a,i,b,j,m){ const w=W(n); snap(w); if(m) w.marks[mk(a,i,b,j)]=m; else delete w.marks[mk(a,i,b,j)]; S.progress[n]=S.progress[n]==='perfect'||S.progress[n]==='solved'?S.progress[n]:'progress'; }
function ref(n,r){ const cats=FREE[n].categories; const a=cats.findIndex(c=>c.id===r[0]); return [a, cats[a].values.findIndex(v=>v.id===r[1])]; }
function stepDone(n,st){ return st.deducedFacts.every(f=>{ let [a,i]=ref(n,f.left),[b,j]=ref(n,f.right); if(a>b){[a,i,b,j]=[b,j,a,i];} return W(n).marks[mk(a,i,b,j)]===1; }); }
function nextStep(n){ return FREE[n].deductionSteps.findIndex(st=>!stepDone(n,st)); }
function applyStep(n,k,silent){
  const w=W(n), st=FREE[n].deductionSteps[k]; if(!st) return;
  if(!silent) snap(w);
  st.deducedFacts.forEach(f=>{ let [a,i]=ref(n,f.left),[b,j]=ref(n,f.right); if(a>b){[a,i,b,j]=[b,j,a,i];} w.marks[mk(a,i,b,j)]=1; });
}
function checkResult(n){
  const c=FREE[n], w=W(n), N=c.categories.length, V=c.categories[0].values.length;
  let full=true;
  for(let a=0;a<N;a++)for(let b=a+1;b<N;b++){
    for(let i=0;i<V;i++){ let rc=0,cc=0;
      for(let j=0;j<V;j++){
        const m=w.marks[mk(a,i,b,j)], t=truth(n,a,i,b,j);
        if(m===1&&!t) return 'bad'; if(m===2&&t) return 'bad';
        if(m===1) rc++; if(w.marks[mk(a,j,b,i)]===1) cc++;
      }
      if(rc>1||cc>1) return 'bad'; if(rc<1) full=false;
    }
  }
  return full?'ok':'part';
}
function pairStats(n,a,b){ const V=FREE[n].categories[a].values.length, w=W(n); let o=0,any=0;
  for(let i=0;i<V;i++)for(let j=0;j<V;j++){ const m=w.marks[mk(a,i,b,j)]; if(m){any++; if(m===1)o++;} }
  return o>=V?'full':any?'part':''; }

/* ---------- clue text ---------- */
function clueHTML(n,t){
  const cats=FREE[n].categories;
  return esc(t).replace(/「([^」]+)」/g,(m,name)=>{ const k=cats.findIndex(c=>c.values.some(v=>v.nameJA===name)); return `「<b class="e e${k<0?0:k}">${name}</b>」`; });
}
const KIND={same:'同じ組',different:'別の組',either:'どちらか',pairSet:'組み合わせ',before:'順序',immediatelyBefore:'直前',offsetBefore:'間隔'};
function nameOf(n,r){ const [a,i]=ref(n,r); return [FREE[n].categories[a].values[i].nameJA,a]; }
function strip(n,cl){
  if(!['before','immediatelyBefore','offsetBefore'].includes(cl.type)) return '';
  const [ln,ka]=nameOf(n,cl.args.left), [rn,kb]=nameOf(n,cl.args.right);
  const oc=FREE[n].categories.find(c=>c.id===cl.args.orderedCategory);
  let mid, lab;
  if(cl.type==='before'){ mid='<i class="ln dash"></i><i class="ln" style="width:10px;margin-left:-2px"></i>'; lab='どこかで前'; }
  else if(cl.type==='immediatelyBefore'){ mid='<i class="ln" style="width:12px"></i>'; lab='すぐ前（隣）'; }
  else { const k=cl.args.offset||2; mid='<i class="sl"></i>'.repeat(Math.max(0,k-1)).replace(/<i class="sl"><\/i>/g,'<i class="sl"></i><i class="ln dash" style="width:8px"></i>')+'<i class="ln" style="width:10px"></i>'; lab=k+'つ前'; }
  return `<div class="strip" aria-hidden="true"><span class="n" style="color:var(--c${ka});border-color:var(--c${ka})">${esc(ln)}</span>${mid}<span class="n" style="color:var(--c${kb});border-color:var(--c${kb})">${esc(rn)}</span><small>${esc(oc.nameJA)}：${lab}</small></div>`;
}
function clueRow(n,cl,idx,opts={}){
  const w=W(n), on=w.checked.has(idx)&&!opts.plain;
  return `<button class="clue ${on?'on':''} ${opts.hl?'hl':''}" ${opts.plain?'':`data-act="clue:${idx}" aria-pressed="${on}"`}>
    <span class="cb">${ic('check','style="width:16px;height:16px"')}</span>
    <span style="min-width:0"><span class="kind">手がかり ${idx+1}<i>${KIND[cl.type]}</i></span>
    <span class="tx" style="display:block">${clueHTML(n,cl.textJA)}</span>${strip(n,cl)}</span></button>`;
}

/* ---------- grid components ---------- */
function dims(n){
  const c=FREE[n], V=c.categories[0].values.length; const len=s=>s.replace(/\d{1,2}/g,'x').length;
  let rh=0, ch=0; c.categories.forEach(cat=>cat.values.forEach(v=>{ rh=Math.max(rh,len(v.nameJA)); ch=Math.max(ch,len(v.nameJA)); }));
  const N=c.categories.length, rhp=Math.max(64,rh*14+22), padCs=Math.max(40,Math.min(56,Math.floor((1194-360-36-rhp-(N-1)*10)/(V*(N-1)))));
  return {cs:S.device==='one'?72:S.device==='pad'?padCs:44, rh:Math.max(64,rh*(S.device==='one'?19:14)+22), chh:Math.max(62,ch*(S.device==='one'?19:14)+16), V};
}
/* Vertical (tate) labels built per character, as SwiftUI would: no writing-mode needed. Digit runs stay together, the long-vowel mark is rotated. */
const tate=s=>(s.match(/\d{1,2}|./g)||[]).map(t=>`<span${t==='ー'?' class="lv"':''}>${esc(t)}</span>`).join('');
const heads=(n,b)=>`<div class="heads">${FREE[n].categories[b].values.map(v=>`<div class="ch hb" style="border-color:var(--c${b})" aria-label="${esc(v.nameJA)}">${tate(v.nameJA)}</div>`).join('')}</div>`;
const rowHeads=(n,a)=>FREE[n].categories[a].values.map(v=>`<div class="rh" style="border-color:var(--c${a})">${esc(v.nameJA)}</div>`).join('');
function cells(n,a,b){
  const V=FREE[n].categories[a].values.length, w=W(n); let h='';
  const rowO=[],colO=[];
  for(let i=0;i<V;i++)for(let j=0;j<V;j++) if(w.marks[mk(a,i,b,j)]===1){rowO[i]=1;colO[j]=1;}
  for(let i=0;i<V;i++)for(let j=0;j<V;j++){
    const m=w.marks[mk(a,i,b,j)]||0, dim=!m&&(rowO[i]||colO[j]);
    const menu=S.menu&&S.menu.a===a&&S.menu.b===b&&S.menu.i===i&&S.menu.j===j;
    h+=`<div class="cell ${dim?'dim':''}" role="button" tabindex="0" data-cell="${a}.${i}.${b}.${j}" aria-label="${esc(FREE[n].categories[a].values[i].nameJA)}と${esc(FREE[n].categories[b].values[j].nameJA)}：${MLAB[m]}">${mark(m)}${menu?`<div class="pop">${[0,1,2,3].map(k=>`<button data-act="setm:${k}" aria-label="${MLAB[k]}">${k?mark(k):'<svg viewBox="0 0 24 24"><path d="M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'}</button>`).join('')}</div>`:''}</div>`;
  }
  return `<div class="cells" style="--n:${V}">${h}</div>`;
}
function pairBlock(n,a,b){
  const cats=FREE[n].categories, ord=cats[b].ordered;
  return `<div class="pair"><div class="corner" style="color:var(--c${a})">${esc(cats[a].nameJA)}</div>
    <div class="hd"><div class="colcap" style="color:var(--c${b})"><span>${esc(cats[b].nameJA)}</span>${ord?'<em>早 → 遅</em>':''}</div>${heads(n,b)}</div>
    <div class="rw">${rowHeads(n,a)}</div>${cells(n,a,b)}</div>`;
}
function staircase(n){
  const N=FREE[n].categories.length, cats=FREE[n].categories;
  let h=`<div style="display:grid;grid-template-columns:var(--rh) repeat(${N-1},auto);gap:14px 10px;justify-content:center">`;
  h+='<div></div>';
  for(let b=1;b<N;b++) h+=`<div><div class="colcap" style="color:var(--c${b})"><span>${esc(cats[b].nameJA)}</span>${cats[b].ordered?'<em>早 → 遅</em>':''}</div>${heads(n,b)}</div>`;
  for(let a=0;a<N-1;a++){
    h+=`<div><div class="colcap" style="color:var(--c${a});justify-content:flex-end;padding-right:8px">${esc(cats[a].nameJA)}</div>${rowHeads(n,a)}</div>`;
    for(let b=1;b<N;b++) h+= b>a ? `<div>${cells(n,a,b)}</div>` : '<div></div>';
  }
  return h+'</div>';
}
function minimap(n){
  const cats=FREE[n].categories, N=cats.length; let h=`<div class="mm" style="grid-template-columns:repeat(${N-1},32px)">`;
  for(let a=0;a<N-1;a++)for(let b=1;b<N;b++){
    if(b<=a){h+='<span></span>';continue;}
    const st=pairStats(n,a,b), cur=S.pair[0]===a&&S.pair[1]===b;
    h+=`<button class="${st}" data-act="pair:${a}.${b}" ${cur?'aria-current="true"':''} aria-label="${esc(cats[a].nameJA)}と${esc(cats[b].nameJA)}"><i style="background:var(--c${a})"></i><i style="background:var(--c${b})"></i></button>`;
  }
  return h+'</div>';
}

/* ---------- screens ---------- */
const status=()=>`<div class="status"><span>9:41</span><i><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="17" height="8" rx="2" fill="currentColor"/><rect x="24" y="4" width="2" height="4" rx="1" fill="currentColor" opacity=".5"/></svg></i></div>`;
const nav=(o={})=>`<div class="nav"><div class="l">${o.back?`<button class="l" data-act="back" style="padding:8px 4px 8px 4px;display:flex;gap:4px;align-items:center">${back}<span>${o.back}</span></button>`:''}</div><div class="t">${o.title||''}${o.sub?`<small>${o.sub}</small>`:''}</div><div class="r">${o.right||''}</div></div>`;
function tabbar(){
  const t=[['library','事件簿','book'],['search','検索','search'],['help','ヘルプ','help']];
  return `<div class="tabbar">${t.map(([k,l,i])=>`<button data-act="tab:${k}" ${S.tab===k?'aria-current="true"':''}>${ic(i)}<span>${l}</span></button>`).join('')}</div>`;
}
function sidebar(){
  const it=(k,l,i)=>`<button data-act="tab:${k}" ${S.tab===k&&!S.sideTier?'aria-current="true"':''}>${ic(i)}<span>${l}</span></button>`;

  return `<nav class="sidebar" aria-label="サイドバー"><div class="ttl">事件簿</div>${it('library','すべての事件','book')}${it('search','検索','search')}<h6>難易度</h6>${['b','s','a','e'].map(ti).join('')}<h6>ガイド</h6>${it('help','ヘルプ','help')}</nav>`;

const state=n=>S.progress[n]||'';
function rowHTML(n){
  const d=info(n), free=!!d[3], open=free||S.own, st=state(n);
  let tr='';
  if(!open) tr=`<span style="color:var(--d-faint)">${ic('lock','style="width:18px;height:18px"')}</span>`;
  else if(st==='perfect') tr='<span class="stamp perfect" title="完全解決">完</span>';
  else if(st==='solved') tr='<span class="stamp solved" title="解決">済</span>';
  else if(st==='progress') tr='<span class="dots" title="途中"><i></i><i></i><i></i></span>'+chev;
  else tr=chev;
  return `<button class="row ${open?'':'lock'}" data-act="open:${n}"><span class="no">${pad4(n)}</span><span class="ti"><b>${esc(d[1])}</b><small>${d[5]}×${d[6]}・約${d[4]}分${open?'':'・全編版'}</small></span>${tr}</button>`;
}
function tileHTML(n){

function libraryList(){
  const t=S.tier, rows=IDX.filter(d=>d[2]===t), PER=10, nv=Math.ceil(rows.length/PER);
  const done=n=>{const q=S.progress[n];return q==='perfect'||q==='solved'};
  const next=rows.findIndex(d=>(d[3]||S.own)&&!done(d[0])); // first open case not yet solved
  const lastIx=rows.findIndex(d=>d[0]===(S.last||741)), anchor=lastIx>=0?lastIx:Math.max(0,next); // last played case, else first open unsolved
  const v=Math.min(S.vol==null?Math.floor(anchor/PER):S.vol,nv-1), vr=rows.slice(v*PER,(v+1)*PER), free=vr.filter(d=>d[3]).length, paid=vr.length-free;
  const solved=Object.entries(S.progress).filter(([n,s])=>(s==='perfect'||s==='solved')&&info(+n)[2]===t).length;
  const lab=i=>`${rows[i*PER][0]}–${rows[Math.min(rows.length,(i+1)*PER)-1][0]}`;
  const opts=Array.from({length:nv},(_,i)=>`<option value="${i}" ${i===v?'selected':''}>第${i+1}巻 ・ ${lab(i)}</option>`).join('');
  const pager=`<div class="pager"><button data-act="vol:${v-1}" ${v?'':'disabled'} aria-label="前の巻" style="transform:scaleX(-1)">${chev}</button><label class="vsel"><select id="volsel" aria-label="巻を選ぶ">${opts}</select><span>第${v+1}巻 ・ ${lab(v)}</span><small>解決 ${solved} / ${rows.length}</small></label><button data-act="vol:${v+1}" ${v<nv-1?'':'disabled'} aria-label="次の巻">${chev}</button></div>`;
  const note=paid&&!S.own?`<div class="sect" style="margin-top:8px"><span>${free?`無料 ${free}件`:'全編版'}${paid&&free?` ・ 残り ${paid}件は全編版`:''}</span><button data-act="buy">¥1,800 で解放</button></div>`:'';
  return `${pager}${note}<div class="group clist">${vr.map(d=>crowHTML(d[0])).join('')}</div><div style="height:16px"></div>`;
}

function overlays(n){
  let h='';
  if(S.hintOpen){
    const k=nextStep(n), c=FREE[n];
    if(k<0) h+=`<div class="hint"><div class="grab"></div><h4>ヒント</h4><div class="ex">すべての手順が盤面に反映されています。「解答を確認」を押してください。</div><div class="acts"><button class="btn" data-act="hintclose">閉じる</button></div></div>`;
    else { const st=c.deductionSteps[k];
      h+=`<div class="hint"><div class="grab"></div><h4>次の推論 ・ ${k+1}/${c.deductionSteps.length}</h4>
      ${st.clueIDs.map(id=>{const i=c.clues.findIndex(x=>x.id===id);return clueRow(n,c.clues[i],i,{plain:true})}).join('')}
      <div class="ex">${clueHTML(n,st.explanationJA.replace(/^手がかり[\d・、]+を使うと、/,''))}</div>
      <div class="facts">${st.deducedFacts.map(f=>`<span>${esc(nameOf(n,f.left)[0])} ＝ ${esc(nameOf(n,f.right)[0])}</span>`).join('')}</div>
      <div class="acts"><button class="btn" data-act="hintclose">反映せず戻る</button><button class="btn pri" data-act="hintapply">盤面に反映</button></div></div>`; }
  }
  if(S.banner==='part') h+=`<div class="banner warn"><b>まだ確定していないマスがあります</b><p>どのマスかはお知らせしません。手がかりを見直して、続けてみましょう。</p><div class="acts"><button class="btn pri" data-act="bclose">編集を続ける</button><button class="btn" data-act="hint">ヒントを見る</button></div></div>`;

  return h;
}

}

/* ---------- compose ---------- */
function topScreen(){ return S.stack[S.stack.length-1]; }
function pageHTML(){
  const t=topScreen();
  if(S.screen==='tutorial') return tutorialScreen();
  if(t&&t.t==='work') return workScreen(t.n);
  if(t&&t.t==='done') return doneScreen(t.n);
  if(t&&t.t==='brief') return briefScreen(t.n);
  return S.tab==='library'?libraryScreen():S.tab==='search'?searchScreen():helpScreen();
}
function render(){
  const pad=S.device==='pad', t=topScreen(), deep=!!t, tut=S.screen==='tutorial';
  const dev=$('#dev'); dev.className='dev '+S.device;
  const scr=$('#scr'); scr.className='scr'+(document.documentElement.dataset.dark==='1'?' dark-prim':'');
  const sk=screenKey(), keep=(S._sk===sk)?[...scr.querySelectorAll('.scroll,.clues')].map(e=>e.scrollTop):[]; S._sk=sk;
  const body=pageHTML();
  const tb=(S.device!=='pad'&&!deep&&!tut)?tabbar():'';
  let sheet=''; if(S.sheet==='purchase') sheet=purchaseSheet(); if(S.sheet==='brief'&&t) sheet=briefSheet(t.n);
  if(S.sheet==='nodata') sheet=`<div class="scrim" data-act="sheetclose"></div><div class="sheet"><div class="grab"></div><h3>この事件は mock に未収録です</h3><p style="margin:0;color:var(--d-soft);font-size:14.5px;line-height:1.7">この mock では無料の30事件だけを実データで遊べます。解放後の970事件は、同じ画面が本物のデータで開きます。</p><button class="cta" style="margin:0;width:100%" data-act="sheetclose">閉じる</button></div>`;
  const hideSide=pad&&(deep||tut);
  const inner=tut?body:(deep||S.tab? `<div class="page">${body}${tb}</div>`:'');
  scr.innerHTML=`<div class="island"></div>${status()}${pad&&!hideSide?`<div class="padshell">${sidebar()}<div class="col"><div class="page">${body}</div></div></div>`:`${tut?body:`<div class="page" ${deep&&t.t==='work'?`style="--tb:${pad?70:90}px"`:''}>${body}${tb}</div>`}`}${sheet}<div class="home"></div>`;
  if(deep&&t.t==='work'){ const p=scr.querySelector('.page'); if(p) p.style.setProperty('--tb', pad?'70px':'90px'); }
  if(keep.length){ const els=scr.querySelectorAll('.scroll,.clues'); if(els.length===keep.length) els.forEach((e,i)=>e.scrollTop=keep[i]); }
  renderPanel(); syncJump(); fit();
}
function screenKey(){
  const t=topScreen();
  if(S.screen==='tutorial') return 'tutorial';
  if(S.sheet==='purchase') return 'purchase';
  if(t&&t.t==='work') return S.hintOpen?'hint':S.banner?'check':'work';
  if(t&&t.t==='done') return 'done';
  if(t&&t.t==='brief') return 'brief';
  return S.tab;
}

const JUMPS=[['tutorial','Tutorial'],['library','Library'],['search','Search'],['help','Help'],['brief','Briefing'],['work','Board'],['work4','Board 4×4'],['hint','Hint'],['check','Check'],['done','Solved'],['purchase','Purchase']];
function buildJump(){ $('#jump').innerHTML=JUMPS.map(([k,l])=>`<button data-act="jump:${k}" data-k="${k}">${l}</button>`).join(''); }
function syncJump(){
  const k=screenKey(), t=topScreen(); let cur=k; if(k==='work'&&t&&t.n===741) cur='work4';
  document.querySelectorAll('#jump button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===cur));
}
function jump(k){
  S.sheet=null;S.hintOpen=false;S.banner=null;S.menu=null;S.screen='app';S.stack=[];
  const openWork=n=>{S.stack=[{t:'work',n}];S.pair=[0,1];};
  if(k==='tutorial'){S.screen='tutorial';S.tut=0;}
  else if(['library','search','help'].includes(k)){S.tab=k;S.sideTier=false;}
  else if(k==='brief'){S.tab='library';S.stack=[{t:'brief',n:5}];}
  else if(k==='work'){S.tab='library';openWork(5);}
  else if(k==='work4'){S.tab='library';openWork(741);}
  else if(k==='hint'){S.tab='library';openWork(5);S.hintOpen=true;S.tipSeen=true;}
  else if(k==='check'){S.tab='library';openWork(5);applyStep(5,0,true);S.banner='part';S.tipSeen=true;}
  else if(k==='done'){S.tab='library';const w=W(5);autoSolve(5);S.stack=[{t:'done',n:5}];}
  else if(k==='purchase'){S.tab='library';S.sheet='purchase';S.tier='s';}
  render();
}
function autoSolve(n){ const w=W(n),N=FREE[n].categories.length,V=FREE[n].categories[0].values.length; w.marks={};
  for(let a=0;a<N;a++)for(let b=a+1;b<N;b++)for(let i=0;i<V;i++)for(let j=0;j<V;j++) if(truth(n,a,i,b,j)) w.marks[mk(a,i,b,j)]=1;
  w.checks=Math.max(1,w.checks); S.progress[n]='perfect'; }

/* ---------- interaction ---------- */
function openCase(n){
  const d=info(n); if(!d[3]&&!S.own){ S.sheet='purchase'; render(); return; }
  if(!FREE[n]){ S.sheet='nodata'; render(); return; }
  S.stack=[{t:'brief',n}]; render();
}
const ACT={

  own:v=>{S.own=v==='1';document.querySelectorAll('[data-act^="own:"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.act==='own:'+v));},

  tier:v=>{S.tier=v;S.vol=null;},

  back:()=>{S.stack.pop();S.hintOpen=false;S.banner=null;},

  restore:()=>{S.own=true;S.sheet=null;document.querySelectorAll('[data-act^="own:"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.act==='own:1'));},
  pair:v=>{S.pair=v.split('.').map(Number);S.menu=null;},
  clue:v=>{const w=W(topScreen().n);const i=+v;w.checked.has(i)?w.checked.delete(i):w.checked.add(i);},
  undo:()=>{const w=W(topScreen().n);if(w.undo.length){w.redo.push(JSON.stringify(w.marks));w.marks=JSON.parse(w.undo.pop());}S.banner=null;},

  bundo:()=>{ACT.undo();},
  hint:()=>{S.hintOpen=true;S.banner=null;S.tipSeen=true;},
  hintclose:()=>{S.hintOpen=false;},
  hintapply:()=>{const n=topScreen().n,k=nextStep(n);if(k>=0){applyStep(n,k);W(n).hints++;}S.hintOpen=false;},
  bclose:()=>{S.banner=null;},
  tipclose:()=>{S.tipSeen=true;},
  check:()=>{const n=topScreen().n,w=W(n);w.checks++;const r=checkResult(n);S.hintOpen=false;S.tipSeen=true;

  setm:v=>{const m=S.menu;if(m){setMark(topScreen().n,m.a,m.i,m.b,m.j,+v);S.menu=null;}},
  next:()=>{const n=topScreen().n;const nx=IDX.find(d=>d[0]>n&&FREE[d[0]]&&d[3]);S.stack=[];if(nx){S.stack=[{t:'brief',n:nx[0]}];}},
  replay:()=>{const n=topScreen().n;delete S.work[n];S.stack=[{t:'work',n}];S.pair=[0,1];},
  tolib:()=>{S.stack=[];S.tab='library';},
  tutor:()=>{S.screen='tutorial';S.tut=0;},
  tutcell:()=>{S.tutCell=(S.tutCell+1)%4;},
  tutnext:()=>{if(S.tut<3)S.tut++;else{S.screen='app';S.tab='library';}},
  tutskip:()=>{S.screen='app';S.tab='library';},
  qt:v=>{S.qtier=v;},

};
document.addEventListener('click',e=>{
  if(e.target.closest('.cell')&&!e.target.closest('.pop')) return;
  const el=e.target.closest('[data-act]'); if(!el) return;
  const [k,...r]=el.dataset.act.split(':'); const f=ACT[k]; if(!f) return;
  const st=document.querySelector('.scroll,.clues');
  const done=f(r.join(':')); if(!done) render();
});
/* cell tap vs long press */
let lp=null, lpFired=false;
document.addEventListener('pointerdown',e=>{
  const c=e.target.closest('.cell'); if(!c||e.target.closest('.pop')) return;
  lpFired=false; clearTimeout(lp);
  lp=setTimeout(()=>{ lpFired=true; const [a,i,b,j]=c.dataset.cell.split('.').map(Number); S.menu={a,i,b,j}; render(); },420);
});
document.addEventListener('pointerup',e=>{
  clearTimeout(lp); const c=e.target.closest('.cell'); if(!c||lpFired||e.target.closest('.pop')) return;
  const [a,i,b,j]=c.dataset.cell.split('.').map(Number), t=topScreen(); if(!t||t.t!=='work') return;
  if(S.menu){S.menu=null;render();return;}
  const cur=W(t.n).marks[mk(a,i,b,j)]||0; setMark(t.n,a,i,b,j,(cur+1)%4); S.banner=null; S.tipSeen=true; render();
});
document.addEventListener('pointercancel',()=>clearTimeout(lp));
document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('cell')){ e.preventDefault(); const [a,i,b,j]=e.target.dataset.cell.split('.').map(Number),t=topScreen(); const cur=W(t.n).marks[mk(a,i,b,j)]||0; setMark(t.n,a,i,b,j,(cur+1)%4); render(); }});
document.addEventListener('change',e=>{ if(e.target.id==='volsel'){ S.vol=+e.target.value; render(); }});
document.addEventListener('input',e=>{ if(e.target.id==='q'){ S.q=e.target.value; $('#res').innerHTML=searchResults(); }});
document.addEventListener('toggle',e=>{ if(e.target.classList&&e.target.classList.contains('aud')) S.audOpen=e.target.open; },true);
document.addEventListener('contextmenu',e=>{ if(e.target.closest('.cell')) e.preventDefault(); });

/* ---------- scale to fit ---------- */
function fit(){
  const dv=S.device, w=dv==='pad'?1216:dv==='one'?766:415, h=dv==='pad'?856:dv==='one'?1155:874;
  const ww=$('.wrap').clientWidth||w; const avail=Math.min(ww>980?ww-28-380:ww, dv==='phone'?415:dv==='one'?766:1000);
  const s=Math.min(1,avail/w), sc=$('#scaler');
  sc.style.width=w*s+'px'; sc.style.height=h*s+'px'; $('#dev').style.transform=`scale(${s})`;
}
addEventListener('resize',fit);
try{ if(window.ResizeObserver) new ResizeObserver(fit).observe($('.wrap')); }catch(e){}
buildJump();
ACT.theme(store.get('lc-theme')||'auto');
W(741); render();
